    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("tema");
        } catch (error) {}
        if (tema !== "claro" && tema !== "oscuro") tema = "oscuro";
        document.documentElement.setAttribute("data-tema", tema);
      })();
    </script>
